<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stand-In</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--fg:#eef0f4;--mute:#8d94a3;--acc:#f2c14e;--good:#4cc38a;--bad:#ef6b5b;--think:#7aa2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Apple SD Gothic Neo",system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:#2a2f3a;color:var(--fg)}
button.primary{background:var(--acc);color:#111;font-weight:700}
button:disabled{opacity:.4;cursor:default}
textarea,input[type=text]{font:inherit;width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px}
.hidden{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:34px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:grid;gap:6px}
.card:hover{border-color:var(--acc)}
.card b{font-size:17px}.card small{color:var(--mute)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.devices{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start;margin:24px 0}
video.self{width:100%;border-radius:12px;transform:scaleX(-1);background:#000;aspect-ratio:4/3;object-fit:cover}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.dot{width:9px;height:9px;border-radius:50%;background:#555}.dot.on{background:var(--good)}.dot.warn{background:var(--bad)}

/* base face, also used on the briefing cards */
.face{width:var(--face,150px);height:var(--face,150px);margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:54px;font-weight:700;position:relative;overflow:hidden;background-size:cover;background-position:center}

/* stage: a call with the people in the room. The photos carry their own surroundings, so they fill the screen */
#stage{position:fixed;inset:0;background:#08090c;overflow:hidden}
.room{position:absolute;inset:0;padding:64px 12px 216px;background-size:cover;background-position:center}
.room::before{content:"";position:absolute;inset:0;background:#08090ce0;backdrop-filter:blur(14px)}
.cast{position:relative;height:100%;display:grid;gap:10px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);justify-content:center}
.cast[data-n="1"]{grid-template-columns:minmax(0,calc(100vh - 280px))}
.person{position:relative;overflow:hidden;border-radius:18px;background:#14161c;box-shadow:0 0 0 1px #ffffff14;transition:filter .3s,box-shadow .12s}
.person.dim{filter:brightness(.72)}
.person.left{filter:grayscale(1) brightness(.3)}
.person.speaking{box-shadow:0 0 0 3px var(--acc),0 0 calc(18px + var(--vol,0) * 46px) #f2c14e77}
#cast .face{position:absolute;inset:0;width:auto;height:auto;margin:0;border-radius:0;font-size:96px;transform:scale(calc(1 + var(--vol,0) * .018));transform-origin:50% 42%}
.face .img{position:absolute;inset:-2%;background-size:cover;background-position:50% 40%;animation:breathe 4.6s ease-in-out infinite;animation-delay:var(--lag,0s);transform-origin:50% 42%}
.face .img.next{opacity:0;transition:opacity .28s ease}
.person.speaking .face .img{animation:talk 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.035) translate(.35%,-.7%)}}
@keyframes talk{0%,100%{transform:scale(1.02) rotate(0)}25%{transform:scale(1.045) rotate(-.9deg) translate(-.5%,-.6%)}60%{transform:scale(1.03) rotate(.8deg) translate(.5%,.2%)}80%{transform:scale(1.05) rotate(-.3deg) translateY(-.8%)}}
@media(prefers-reduced-motion:reduce){.face .img{animation:none!important}}
.expr{position:absolute;right:14px;top:12px;font-size:30px;line-height:1}
.tag{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);padding:5px 12px;border-radius:10px;background:#000000a6;backdrop-filter:blur(6px);display:grid}
.tag .name{font-weight:700;font-size:15px}.tag .role{color:#c9cdd6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thinking .face::after{content:"···";position:absolute;right:16px;bottom:10px;font-size:30px;color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.top{position:absolute;z-index:5;inset:0 0 auto 0;height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top .ttl{min-width:0}.top .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .setting{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .acts{display:flex;align-items:center;gap:8px;flex:none}
.top .acts button{padding:7px 13px;font-size:14px;background:#ffffff1a}
#turnText{color:var(--mute);font-size:14px;margin-right:6px}
.caption{position:absolute;z-index:4;left:50%;bottom:112px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));padding:10px 20px;border-radius:14px;background:#000000b8;backdrop-filter:blur(8px);font-size:19px;line-height:1.45;text-align:center}
.caption:empty{display:none}
.caption .who{display:block;font-size:13px;font-weight:700;color:var(--acc);margin-bottom:2px}
.caption.narr{font-style:italic;color:#c9cdd6;font-size:17px}
.dock{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100% - 32px));padding:10px 12px;border-radius:18px;background:#14161ceb;box-shadow:0 0 0 1px #ffffff14,0 12px 32px #0008;backdrop-filter:blur(10px);display:grid;gap:6px}
.mic{display:grid;gap:6px}
.mic .status{font-size:13px;color:var(--mute);padding:0 4px}
.mic .heard{font-size:17px;padding:0 4px}.mic .heard:empty{display:none}
.mic .heard i{color:var(--mute)}
.mic .row{flex-wrap:nowrap;gap:8px}
.mic input[type=text]{padding:9px 12px;background:#0d0f13}
.mic button{white-space:nowrap}
.me{position:absolute;z-index:6;right:14px;bottom:14px;width:176px}
.me video.self{display:block;border-radius:12px;box-shadow:0 0 0 1px #ffffff26,0 8px 24px #0009}
.me .cam-state{position:absolute;left:6px;top:6px;font-size:11px;padding:1px 8px;background:#000000a6;border:0;color:#fff}
.log{position:absolute;z-index:7;top:60px;right:12px;bottom:12px;width:min(360px,calc(100% - 24px));padding:14px;border-radius:16px;background:#14161cf5;box-shadow:0 0 0 1px #ffffff1f;overflow:auto;font-size:14px;color:#c9cdd6;display:grid;gap:8px;align-content:start}
.log b{color:var(--fg)}
.coach{position:absolute;z-index:5;left:12px;top:64px;bottom:12px;width:286px;padding:14px;border-radius:16px;background:#14161cf0;box-shadow:0 0 0 1px #ffffff1f;overflow:auto;display:none;align-content:start;gap:10px}
.coached .coach{display:grid}
.coached .room{padding-left:310px}
.coached .caption,.coached .dock{left:calc(50% + 149px);width:min(700px,calc(100% - 340px - 200px))}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghead button{padding:4px 10px;font-size:13px;background:#ffffff1a}
#goalCount,#foundCount{color:var(--acc);font-weight:700}
.gbar{height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:var(--good);transition:width .5s ease}
#goalList{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;line-height:1.4}
#goalList li{display:grid;grid-template-columns:22px 1fr;gap:6px;color:#c9cdd6}
#goalList .mark{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px #ffffff40;display:grid;place-items:center;font-size:12px;font-weight:700}
#goalList .partial .mark{color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
#goalList .done .mark{background:var(--good);color:#06130c;box-shadow:none;animation:pop .45s ease}
#goalList .done{color:var(--fg)}
#goalList small{display:block;color:var(--mute);font-size:12px}
@keyframes pop{40%{transform:scale(1.5)}}
#coachBody{display:grid;gap:8px;font-size:14px;line-height:1.45;transition:opacity .2s}
#coachBody.busy{opacity:.55}
#coachBody .good{color:var(--good)}#coachBody .hint{color:var(--acc);font-weight:600}
#coachBody .better{padding:8px 10px;border-radius:10px;background:#ffffff0f;display:grid;gap:4px}
#coachBody .better q{quotes:none}#coachBody small{color:var(--mute);font-size:12px}
#goalToast{position:absolute;z-index:8;left:50%;top:76px;transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:var(--good);color:#06130c;font-weight:700;opacity:0;pointer-events:none}
#goalToast.show{animation:toast 2.2s ease}
@keyframes toast{10%,75%{opacity:1;transform:translate(-50%,6px)}100%{opacity:0}}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.score b{font-size:40px;color:var(--acc)}
.score .up{color:var(--good);font-weight:700}.tries{color:var(--mute);width:100%}
.logopen .room{padding-right:386px}
.logopen .caption,.logopen .dock{left:calc(50% - 187px);width:min(680px,calc(100% - 412px))}
.coached.logopen .caption,.coached.logopen .dock{left:calc(50% - 38px);width:calc(100% - 724px)}
.logopen .me{display:none}

/* debrief */
/* home */
.logo{font-size:20px;letter-spacing:-.01em}
.hero{padding:64px 0 48px;display:grid;gap:14px;max-width:760px}
.hero h1{font-size:44px;line-height:1.15}
.hero textarea{font-size:18px}
details>summary{cursor:pointer;color:var(--mute)}
/* build */
#build{position:fixed;inset:0;display:grid;grid-template-columns:minmax(320px,420px) 1fr;background:#08090c}
.bchat{display:grid;grid-template-rows:auto 1fr auto auto;gap:10px;padding:14px;min-height:0;background:var(--panel);box-shadow:1px 0 0 #ffffff14}
#bmsgs{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;line-height:1.45}
.msg.them{align-self:flex-start;background:#ffffff12}
.msg.you{align-self:flex-end;background:var(--acc);color:#111}
.msg.typing{color:var(--mute)}
.bin{flex-wrap:nowrap;align-items:stretch}.bin textarea{resize:none}
.bbtns{display:grid;gap:6px;flex:none}.bbtns button{white-space:nowrap;padding:6px 12px}
#bmic.on{background:var(--bad);color:#fff}
.bworld{position:relative;display:grid;grid-template-rows:1fr auto;gap:16px;padding:20px;min-height:0;overflow:hidden;background:#0d0f13 center/cover;transition:background-image .6s}
#bempty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:18px;pointer-events:none}
#bpeople{align-self:end;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:0}
.bp{width:clamp(130px,17vw,220px);display:grid;gap:2px;text-align:center;animation:rise .5s ease}
.bp small{color:#c9cdd6;font-size:12px}
.bf{aspect-ratio:1;border-radius:16px;background:#ffffff14 center/cover;box-shadow:0 0 0 1px #ffffff24,0 10px 26px #0008;display:grid;place-items:center;margin-bottom:6px}
.bp.drawing .bf{animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{50%{background-color:#ffffff2e}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.bfoot{display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:#000000a6;backdrop-filter:blur(8px);font-size:14px}
#bsummary{display:grid;gap:2px}#bsummary small{color:var(--acc);margin-right:6px}
@media(max-width:800px){#build{grid-template-columns:1fr;grid-template-rows:1fr 46%}.bworld{order:-1}.hero{padding-top:32px}.hero h1{font-size:32px}}

/* briefing */
.q{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.q small{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:4px 12px;border-radius:999px;font-size:14px}
.chips button.on{background:var(--acc);color:#111}
.field{display:grid;gap:4px}.field label{font-size:13px;color:var(--mute)}
.bgbox{aspect-ratio:16/9;max-height:300px;border-radius:14px;background:radial-gradient(ellipse at top,#232838 0%,var(--bg) 70%);background-size:cover;background-position:center;border:1px solid var(--line)}
.who-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:120px 1fr;gap:14px}
.who-card .face{--face:120px;margin:0}
details{background:#13161c;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details summary{cursor:pointer;color:var(--mute)}
details[open] summary{margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border-radius:0;background:var(--panel)}.seg button.on{background:var(--acc);color:#111;font-weight:700}
.warnbox{border-left:4px solid var(--bad);background:var(--panel);padding:10px 14px;border-radius:8px;font-size:14px}
@media(max-width:700px){.coached .room{padding-left:12px}.coach{top:auto;bottom:190px;left:8px;right:8px;width:auto;max-height:34%}.coached .caption,.coached .dock{left:50%;width:calc(100% - 32px)}.who-card{grid-template-columns:1fr}}

.verdict{font-size:19px;background:var(--panel);border-left:4px solid var(--acc);padding:16px 20px;border-radius:8px}
.crit{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.crit .ok{color:var(--good);font-weight:700}.crit .no{color:var(--bad);font-weight:700}
.secret{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.tl{display:grid;gap:2px}
.tl .l{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 10px;border-radius:8px}
.tl .l.user{background:#1d2230}
.tl .who{color:var(--mute);font-size:13px}
.tl .inner{color:#f0a493;font-size:14px;margin-top:4px}
.tl .cue{display:inline-block;font-size:12px;color:var(--think);border:1px solid #7aa2ff55;border-radius:6px;padding:0 6px;margin:4px 4px 0 0}
.tp{background:var(--panel);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.tp .try{color:var(--good)}
section{margin:28px 0;display:grid;gap:12px}
h2{margin:0;font-size:22px}
@media(max-width:700px){.logopen .room{padding-right:12px}.logopen .caption,.logopen .dock{left:50%;width:calc(100% - 32px)}.devices{grid-template-columns:1fr}.tl .l{grid-template-columns:1fr}.cast{--cols:1!important}.cast[data-n="1"]{grid-template-columns:minmax(0,1fr)}.me{width:92px;top:68px;right:18px;bottom:auto}.caption{font-size:16px;bottom:96px}.top .setting{display:none}}
</style>

<!-- HOME: start from what the user imagines -->
<div id="home" class="wrap">
  <div class="row" style="justify-content:space-between"><b class="logo">Stand-In</b><div class="seg" id="uiLang"><button data-lang="en">EN</button><button data-lang="ko">한국어</button><button data-lang="ja">日本語</button></div></div>
  <div class="hero">
    <h1 data-t="hHero"></h1>
    <p class="sub" data-t="hSub"></p>
    <textarea id="situation" rows="3" data-tp="hPh"></textarea>
    <div class="row"><button id="buildBtn" class="primary" data-t="hGo"></button><span id="makeState" class="sub" style="margin:0"></span></div>
    <div class="chips" id="starters"></div>
  </div>
  <h2 style="margin-bottom:12px" data-t="hEx"></h2>
  <div id="presets" class="grid"></div>
  <details style="margin-top:24px"><summary data-t="hDev"></summary>
  <div class="devices">
    <div><video id="preview" class="self" autoplay muted playsinline></video></div>
    <div style="display:grid;gap:10px">
      <div class="row">
        <span class="badge"><span id="camDot" class="dot"></span><span id="camText" data-t="camOff"></span></span>
        <span class="badge"><span id="micDot" class="dot"></span><span id="micText"></span></span>
      </div>
      <div class="row">
        <button id="camBtn" data-t="camOn"></button>
        <label class="badge"><input type="checkbox" id="voiceOut" checked> <span data-t="hearThem"></span></label>
        <label class="badge"><input type="checkbox" id="voiceIn" checked> <span data-t="speakIn"></span></label>
      </div>
      <small style="color:var(--mute)" data-t="privacy"></small>
    </div>
  </div></details>
</div>

<!-- BUILD: talk on the left, the world appears on the right -->
<div id="build" class="hidden">
  <div class="bchat">
    <div class="ghead"><b class="logo">Stand-In</b><button onclick="location.reload()" data-t="home"></button></div>
    <div id="bmsgs"></div>
    <div class="chips" id="bchips"></div>
    <div class="row bin"><textarea id="bsay" rows="2" data-tp="bPh"></textarea><div class="bbtns"><button id="bmic"></button><button id="bsend" class="primary" data-t="bSend"></button></div></div>
  </div>
  <div class="bworld" id="bworld">
    <div id="bempty" data-t="bEmpty"></div>
    <div id="bpeople"></div>
    <div class="bfoot">
      <div id="bsummary"></div>
      <div class="row"><button id="baddBtn" data-t="bAdd"></button><button id="bplaceBtn" data-t="bPlace"></button><button id="benter" class="primary" data-t="bEnter" disabled></button></div>
      <small id="bstate" class="sub" style="margin:0"></small>
    </div>
  </div>
</div>

<!-- BRIEFING: everything is editable before entering -->
<div id="brief" class="wrap hidden"></div>

<!-- STAGE -->
<div id="stage" class="hidden">
  <div class="room" id="room"><div class="cast" id="cast"></div></div>
  <div class="top">
    <div class="ttl"><b id="title"></b><div class="setting" id="setting"></div></div>
    <div class="acts"><span id="turnText"></span><button id="coachBtn" data-t="coachBtn"></button><button id="logBtn" data-t="log"></button><button id="endBtn" data-t="finish"></button></div>
  </div>
  <div class="caption" id="caption"></div>
  <div class="dock"><div class="mic">
    <div class="status" id="micStatus"></div>
    <div class="heard" id="heard"></div>
    <div class="row"><input type="text" id="typed" data-tp="typePh" style="flex:1"><button id="doneBtn" class="primary" data-t="done"></button></div>
  </div></div>
  <div class="me"><video id="selfView" class="self" autoplay muted playsinline></video>
    <span class="badge cam-state"><span id="eyeDot" class="dot"></span><span id="eyeText" data-t="noCam"></span></span></div>
  <aside class="coach">
    <div class="ghead"><b data-t="cGoals"></b><span id="goalCount"></span></div>
    <div class="gbar"><i id="goalBar"></i></div>
    <ul id="goalList"></ul>
    <div class="ghead"><b data-t="cFound"></b><span id="foundCount"></span></div>
    <div class="ghead"><b data-t="cCoach"></b><button id="retryBtn" data-t="cRetry"></button></div>
    <div id="coachBody"></div>
  </aside>
  <div id="goalToast"></div>
  <aside class="log hidden" id="log"></aside>
</div>

<!-- DEBRIEF -->

<script type="module">

let UI = "en";
try{ UI = localStorage.getItem("standin-ui") || (["ko","ja"].includes(navigator.language.slice(0,2)) ? navigator.language.slice(0,2) : "en"); }catch(e){}
const t = k => T[k]?.[UI] ?? k;
function applyLang(){
  document.documentElement.lang = UI;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(el => el.placeholder = t(el.dataset.tp));
  document.querySelectorAll("#uiLang button").forEach(b => b.classList.toggle("on", b.dataset.lang === UI));
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const EMOJI = {neutral:"😐", pleased:"🙂", skeptical:"🤨", annoyed:"😠"};
const LANG = {ko:"ko-KR", en:"en-US", ja:"ja-JP", zh:"zh-CN"};

let S = null;          // {id, scenario, assets}

// ---------- camera: MediaPipe face landmarks, computed locally ----------
const cam = {on:false, ready:false, stream:null, lm:null, base:null, calib:[], rec:false,
             n:0, present:0, contact:0, down:0, now:{present:false, contact:false, down:false}};

async function startCamera(){
  try{
    cam.stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}, audio:false});
  }catch(e){ $("camText").textContent = t("camDenied"); return; }
  $("preview").srcObject = cam.stream; $("selfView").srcObject = cam.stream;
  cam.on = true; $("camText").textContent = t("camLoading"); $("camBtn").disabled = true;
  try{
    const v = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const files = await v.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    cam.lm = await v.FaceLandmarker.createFromOptions(files, {
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:"CPU"},
      outputFaceBlendshapes:true, runningMode:"VIDEO", numFaces:1});
    cam.ready = true; $("camText").textContent = t("camCal");
    loop();
  }catch(e){ console.error(e); $("camText").textContent = t("camFail"); }
}

let lastT = 0;
function loop(){
  const video = $("preview");
  const t = performance.now();
  if(video.readyState >= 2 && t - lastT > 100){
    lastT = t;
    const r = cam.lm.detectForVideo(video, t);
    measure(r);
  }
  requestAnimationFrame(loop);
}

function measure(r){
  const now = {present:false, contact:false, down:false};
  const f = r.faceLandmarks?.[0];
  if(f){
    now.present = true;
    const L = f[33], R = f[263], N = f[1];
    const d = Math.hypot(R.x-L.x, R.y-L.y) || 1;
    const yaw = (N.x - (L.x+R.x)/2)/d, pitch = (N.y - (L.y+R.y)/2)/d;
    const bs = Object.fromEntries((r.faceBlendshapes?.[0]?.categories||[]).map(c => [c.categoryName, c.score]));
    const eyeDown = ((bs.eyeLookDownLeft||0) + (bs.eyeLookDownRight||0))/2;
    const eyeSide = Math.max(bs.eyeLookOutLeft||0, bs.eyeLookOutRight||0, bs.eyeLookInLeft||0, bs.eyeLookInRight||0);
    if(!cam.base){
      cam.calib.push({yaw, pitch});
      if(cam.calib.length >= 30){
        const med = k => cam.calib.map(c => c[k]).sort((a,b)=>a-b)[15];
        cam.base = {yaw:med("yaw"), pitch:med("pitch")};
        $("camText").textContent = t("camReady"); $("camDot").className = "dot on";
      }
    }else{
      now.down = pitch - cam.base.pitch > 0.12 || eyeDown > 0.5;
      now.contact = !now.down && Math.abs(yaw - cam.base.yaw) < 0.25 && eyeSide < 0.6;
    }
  }
  cam.now = now;
  if(cam.base){
    $("eyeDot").className = "dot " + (now.contact ? "on" : now.present ? "warn" : "");
    $("eyeText").textContent = !now.present ? t("noFace") : now.contact ? t("eye") : now.down ? t("down") : t("away");
  }
  if(cam.rec){ cam.n++; cam.present += now.present; cam.contact += now.contact; cam.down += now.down; }
}

$("camBtn").onclick = startCamera;

// ---------- voice out: speechSynthesis, one voice per character ----------
let voices = [];
const loadVoices = () => { voices = speechSynthesis.getVoices(); };
loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;

function browserVoice(text, who){
  const lang = LANG[S.scenario.language] || S.scenario.language;
  const pool = voices.filter(v => v.lang.replace("_","-").startsWith(lang.slice(0,2)));
  const idx = Math.max(0, S.scenario.cast.findIndex(c => c.name === who));
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  if(pool.length) u.voice = pool[idx % pool.length];
  u.pitch = [1.0, 0.75, 1.25, 0.9][idx % 4];
  u.rate = 1.05;
  return new Promise(res => {
    const guard = setTimeout(res, 2500 + text.length * 160);  // Chrome sometimes never fires onend
    u.onend = u.onerror = () => { clearTimeout(guard); res(); };
    speechSynthesis.speak(u);
  });
}

// asked for as soon as the sentence arrives, so it is usually ready when its turn comes
function prepareVoice(text, who){
  if(!$("voiceOut").checked || !text) return null;
  return fetch("/api/speak", {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id:S.id, speaker:who, text})})
    .then(r => r.ok ? r.blob() : null).catch(() => null);
}

// the speaker's tile moves with the loudness of their voice
let audioCtx = null;
function meter(audio, who){
  const el = $("p" + S.scenario.cast.findIndex(c => c.name === who));
  if(!el) return () => {};
  let live = true;
  try{
    audioCtx ??= new AudioContext(); audioCtx.resume();
    const an = audioCtx.createAnalyser(); an.fftSize = 512;
    audioCtx.createMediaElementSource(audio).connect(an); an.connect(audioCtx.destination);
    const buf = new Uint8Array(an.fftSize);
    const tick = () => {
      if(!live) return;
      an.getByteTimeDomainData(buf);
      const rms = Math.sqrt(buf.reduce((s, v) => s + ((v - 128) / 128) ** 2, 0) / buf.length);
      el.style.setProperty("--vol", Math.min(1, rms * 5).toFixed(3));
      requestAnimationFrame(tick);
    };
    tick();
  }catch(e){ console.warn(e); }
  return () => { live = false; el.style.setProperty("--vol", 0); };
}

let nowPlaying = null;
function stopVoice(){ speechSynthesis.cancel(); nowPlaying?.pause(); nowPlaying?.onended?.(); }

async function speak(text, who, prepared){
  if(!$("voiceOut").checked || !text) return sleep(Math.min(6000, 1200 + text.length * 45));
  const blob = await (prepared ?? prepareVoice(text, who));
  if(!blob) return browserVoice(text, who);
  const url = URL.createObjectURL(blob), audio = new Audio(url);
  nowPlaying = audio;
  const stopMeter = meter(audio, who);
  return new Promise(res => {
    audio.onended = audio.onerror = () => { audio.onended = audio.onerror = null; stopMeter(); URL.revokeObjectURL(url); nowPlaying = null; res(); };
    audio.play().catch(() => { audio.onended?.(); });
  });
}

// ---------- voice in: Web Speech API ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micLabel = () => { $("micText").textContent = SR ? t("srOk") : t("srNo"); };
$("micDot").className = "dot " + (SR ? "on" : "warn");
if(!SR) $("voiceIn").checked = false;

const ear = {rec:null, final:"", interim:"", t0:0, first:0, last:0, firstKey:0, timer:null};

function listen(){
  state = "listen";
  ear.final = ""; ear.interim = ""; ear.t0 = performance.now(); ear.first = 0; ear.last = 0; ear.firstKey = 0;
  Object.assign(cam, {rec:true, n:0, present:0, contact:0, down:0});
  $("heard").innerHTML = ""; $("doneBtn").disabled = false; $("typed").disabled = false;
  setPeople(null);
  if($("voiceIn").checked && SR){
    $("micStatus").textContent = t("listening");
    startRec();
    ear.timer = setInterval(() => {
      if((ear.final || ear.interim) && ear.last && performance.now() - ear.last > 1900) finish();
    }, 250);
  }else{
    $("micStatus").textContent = t("typeNow"); $("typed").focus();
  }
}

function startRec(){
  const r = new SR();
  r.lang = LANG[S.scenario.language] || S.scenario.language; r.continuous = true; r.interimResults = true;
  r.onresult = e => {
    const t = performance.now();
    if(!ear.first) ear.first = t;
    ear.last = t;
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const x = e.results[i];
      if(x.isFinal) ear.final += x[0].transcript + " "; else interim += x[0].transcript;
    }
    ear.interim = interim;
    $("heard").innerHTML = esc(ear.final) + "<i>" + esc(interim) + "</i>";
  };
  r.onend = () => { if(state === "listen" && ear.rec === r) startRec(); };  // Chrome stops on its own after silence
  r.onerror = e => { if(e.error === "not-allowed"){ $("micStatus").textContent = t("micDenied"); } };
  ear.rec = r;
  try{ r.start(); }catch(e){}
}

function stopRec(){
  clearInterval(ear.timer);
  const r = ear.rec; ear.rec = null;
  if(r){ r.onend = null; try{ r.stop(); }catch(e){} }
}

$("typed").addEventListener("keydown", e => {
  if(!ear.firstKey) ear.firstKey = performance.now();
  if(e.key === "Enter" && !e.isComposing && $("typed").value.trim()) finish($("typed").value);
});
$("doneBtn").onclick = () => finish();

function measureSignals(text, typed){
  const start = typed ? ear.firstKey : ear.first;
  const sig = {fillers:0, camera: !!(cam.on && cam.base && cam.n > 5)};
  if(start) sig.hesitation_s = +((start - ear.t0)/1000).toFixed(1);
  if(!typed && ear.first && ear.last > ear.first){
    sig.speak_s = +((ear.last - ear.first)/1000).toFixed(1);
    const syl = (text.match(/[가-힣ぁ-んァ-ン一-龯]/g) || []).length || text.split(/\s+/).length * 1.4;
    sig.syllables_per_s = +(syl / Math.max(sig.speak_s, 0.5)).toFixed(1);
  }
  sig.fillers = (text.match(/(^|\s)(어+|음+|그+|저+|아+|um+|uh+|えー|あの)(?=[\s,.]|$)/gi) || []).length;
  if(sig.camera){
    sig.eye_contact_pct = Math.round(100 * cam.contact / cam.n);
    sig.looking_down_pct = Math.round(100 * cam.down / cam.n);
    sig.face_missing_pct = Math.round(100 * (cam.n - cam.present) / cam.n);
  }
  return sig;
}

async function finish(typedText){
  if(state !== "listen") return;
  const typed = typedText !== undefined || (!ear.final.trim() && !ear.interim.trim() && $("typed").value.trim());
  const text = (typed ? (typedText ?? $("typed").value) : (ear.final + " " + ear.interim)).trim();
  if(!text){ return; }
  stopRec(); cam.rec = false;
  const signals = measureSignals(text, typed);
  state = "wait"; $("typed").value = ""; $("typed").disabled = true; $("doneBtn").disabled = true;
  $("micStatus").textContent = t("thinking");
  addLog(t("me"), text);
  turnLog = $("log").children.length - 1;
  setThinking(true);
  turn++; $("turnText").textContent = `${turn} / ${S.scenario.max_turns}`;
  let done = null;
  try{
    done = await (COACH && askCoach(text), streamTurn({id:S.id, say:text, signals}));
  }catch(e){ console.error(e); }
  setThinking(false);
  if(!done){ $("micStatus").textContent = t("lost"); listen(); return; }
  if(done.ended){ over(done.ended); } else listen();
}

// ---------- a turn arrives as events; a queue keeps caption, face and voice in step ----------
async function streamTurn(body){
  const r = await fetch("/api/turn", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error(await r.text());
  const queue = [], lines = {};
  let closed = false, wake = null, done = null;
  const push = job => { queue.push(job); wake?.(); };

  const worker = (async () => {
    while(true){
      if(!queue.length){
        if(closed) return;
        await new Promise(res => wake = res); wake = null;
        continue;
      }
      await queue.shift()();
    }
  })();

  const onEvent = ev => {
    setThinking(false);
    if(ev.type === "narration") push(Object.assign(() => playLine({speaker:"narration", say:ev.text}), {}));
    if(ev.type === "line_start"){
      const i = S.scenario.cast.findIndex(c => c.name === ev.speaker);
      lines[ev.index] = "";
      push(Object.assign(() => { setFace(i, ev.expression); setPeople(ev.speaker); caption(ev.speaker, ""); }, {line:ev.index}));
    }
    if(ev.type === "sentence"){
      const voice = prepareVoice(ev.text, ev.speaker);
      push(Object.assign(async () => {
        lines[ev.index] += (lines[ev.index] ? " " : "") + ev.text;
        caption(ev.speaker, lines[ev.index]);
        await speak(ev.text, ev.speaker, voice);
      }, {line:ev.index}));
    }
    if(ev.type === "replace"){  // the leak guard caught a line: stop it and say the new one
      for(let k = queue.length - 1; k >= 0; k--) if(queue[k].line === ev.index) queue.splice(k, 1);
      stopVoice();
      push(async () => {
        const i = S.scenario.cast.findIndex(c => c.name === ev.speaker);
        setFace(i, ev.expression); setPeople(ev.speaker); caption(ev.speaker, ev.say);
        await speak(ev.say, ev.speaker);
      });
    }
    if(ev.type === "line_end") push(async () => {
      const i = S.scenario.cast.findIndex(c => c.name === ev.speaker);
      setFace(i, ev.expression); addLog(ev.speaker, ev.say); await sleep(150);
    });
    if(ev.type === "secret") push(() => { S.found = (S.found || 0) + 1; showFound(); toast(`🔓 ${t("cSecret")}: ${ev.speaker}`); });
    if(ev.type === "done"){ done = ev; if(ev.cues) addLog(t("seen"), ev.cues, true); }
  };

  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while(true){
    const {value, done:eof} = await reader.read();
    if(eof) break;
    buf += dec.decode(value, {stream:true});
    let nl;
    while((nl = buf.indexOf("\n")) >= 0){
      const row = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if(row) onEvent(JSON.parse(row));
    }
  }
  closed = true; wake?.();
  await worker;
  return done;
}

  const p = S.assets?.portraits?.[c.name];
  return p ? (p[expression] || p.neutral) : null;
}

function renderCast(){
  $("cast").innerHTML = S.scenario.cast.map((c, i) => {

function setFace(i, expression){
  const el = $("p" + i); if(!el) return;
  const img = portrait(S.scenario.cast[i], expression);
  const [base, next] = el.querySelectorAll(".face .img");
  if(img){
    el.querySelector(".ini").textContent = "";
    if(!base.style.backgroundImage) base.style.backgroundImage = `url(${img})`;
    else if(!base.style.backgroundImage.includes(img)){  // crossfade, then settle on the new face
      next.style.backgroundImage = `url(${img})`; next.style.opacity = 1;
      clearTimeout(next.timer);
      next.timer = setTimeout(() => { base.style.backgroundImage = `url(${img})`; next.style.transition = "none"; next.style.opacity = 0;
        requestAnimationFrame(() => next.style.transition = ""); }, 380);
    }
  }
  el.querySelector(".expr").textContent = img ? "" : (EMOJI[expression] || EMOJI.neutral);  // the photo shows it
}

function setPeople(speaker){
  S.scenario.cast.forEach((c, i) => {
    const el = $("p" + i); if(!el || el.classList.contains("left")) return;

async function playLine(ln){
  if(ln.speaker === "narration"){
    $("caption").className = "caption narr"; $("caption").textContent = ln.say;
    addLog("*", ln.say);
    const leaver = S.scenario.cast.findIndex(c => ln.say.includes(c.name) && /(자리를 뜬다|leaves the|席を立つ)/.test(ln.say));

    await sleep(Math.min(5000, 1500 + ln.say.length * 40));

  setFace(i, ln.expression); setPeople(ln.speaker); caption(ln.speaker, ln.say);
  addLog(ln.speaker, ln.say);
  await speak(ln.say, ln.speaker);
  await sleep(250);
}

function setPath(path, raw){

  const k = keys[keys.length - 1];
  let v = raw;
  if(["user_knows", "red_lines", "success_criteria"].includes(k)) v = unlines(raw);
  if(["trust", "patience", "max_turns"].includes(k)) v = parseInt(raw, 10) || 0;
  if(k === "name" && keys[0] === "cast"){  // keep portraits and the opening speaker attached to the renamed person
    const old = o.name;
    if(D.assets.portraits[old]){ D.assets.portraits[v] = D.assets.portraits[old]; delete D.assets.portraits[old]; }
    if(s.opening_speaker === old) s.opening_speaker = v;
  }
  o[k] = v;
}

async function makeBackground(){
  $("bgBtn").disabled = true; $("bgState").textContent = t("drawing");
  try{
    const r = await post("/api/image", {scenario:D.scenario, kind:"background", prompt:$("bgPrompt").value});
    D.assets.background = r.background; D.background_prompt = $("bgPrompt").value;
    $("bgState").textContent = ""; paintBrief(); $("bgBtn").firstChild.textContent = t("bgRe") + " ";
  }catch(e){ $("bgState").textContent = t("failed") + e; }
  $("bgBtn").disabled = false;
}

async function makeFace(i, btn){
  btn.disabled = true; const label = btn.textContent; btn.textContent = t("drawing");
  try{
    const c = D.scenario.cast[i];
    const r = await post("/api/image", {scenario:D.scenario, kind:"portrait", name:c.name});
    D.assets.portraits[c.name] = r.portrait; paintBrief(); btn.textContent = t("faceRe") + " ($0.04)";
  }catch(e){ btn.textContent = label; alert(t("failed") + e); }
  btn.disabled = false;
}

// ---------- live coach: runs beside the scene, so the user never waits for it ----------
let coachSeq = 0, turnLog = 0;
function renderGoals(goals = [], notes = []){
  const crit = S.scenario.success_criteria, n = goals.filter(g => g === "done").length;
  $("goalCount").textContent = `${n} / ${crit.length}`;
  $("goalBar").style.width = `${100 * n / crit.length}%`;
  $("goalList").innerHTML = crit.map((c, i) => {
    const g = goals[i] || "todo";
    return `<li class="${g}"><span class="mark">${g === "done" ? "✓" : g === "partial" ? "◐" : ""}</span><span>${esc(c)}${notes[i] && g !== "todo" ? `<small>${esc(notes[i])}</small>` : ""}</span></li>`;
  }).join("");
}
function toast(text){
  const el = $("goalToast");
  el.textContent = text; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}
function showFound(){ $("foundCount").textContent = `${S.found || 0} / ${S.scenario.cast.length}`; }
function coachText(c = {}){
  $("coachBody").innerHTML = (c.good ? `<div class="good">👏 ${esc(c.good)}</div>` : "")
    + (c.hint ? `<div class="hint">→ ${esc(c.hint)}</div>` : `<small>${t("cWait")}</small>`)
    + (c.better ? `<div class="better"><small>${t("cBetter")}</small><q>${esc(c.better)}</q>${c.why ? `<small>${esc(c.why)}</small>` : ""}</div>` : "");
}
async function askCoach(say){
  const seq = ++coachSeq, before = (S.goals || []).filter(g => g === "done").length;
  $("coachBody").classList.add("busy");
  let c;
  try{ c = await post("/api/coach", {id:S.id, say}); }catch(e){ console.warn(e); return; }
  if(seq !== coachSeq) return;
  S.goals = c.goals; S.lastBetter = c.better;
  $("coachBody").classList.remove("busy");
  renderGoals(c.goals, c.notes); coachText(c);
  if(c.goals.filter(g => g === "done").length > before) toast(`✓ ${t("cDone")}`);
}
async function takeBack(){
  if(!["listen", "over"].includes(state) || !turn) return;
  stopRec(); stopVoice(); coachSeq++;
  let r;
  try{ r = await post("/api/rewind", {id:S.id}); }catch(e){ console.warn(e); return; }
  turn = r.turn; S.goals = r.goals; S.found = r.found; showFound();
  $("turnText").textContent = `${turn} / ${S.scenario.max_turns}`;
  while($("log").children.length > turnLog) $("log").lastChild.remove();
  document.querySelectorAll(".person.left").forEach(el => el.classList.remove("left"));
  $("doneBtn").textContent = t("done"); $("doneBtn").onclick = () => finish();
  renderGoals(r.goals);
  if(S.lastBetter) $("typed").value = S.lastBetter;
  listen();
}
function attemptsHTML(d){
  const met = d.debrief.criteria.filter(c => c.met).length, all = d.debrief.criteria.length;
  attempts.push({met, all});
  const prev = attempts[attempts.length - 2];
  return `<div class="score"><b>${met} / ${all}</b>${prev && met > prev.met ? `<span class="up">${t("improved")}</span>` : ""}
    ${attempts.length > 1 ? `<div class="tries">${attempts.map((a, i) => `<span>${t("attempt")} ${i + 1}: ${a.met}/${a.all}</span>`).join(" → ")}</div>` : ""}</div>`;
}
const attempts = [];

async function enter(){
  document.activeElement?.blur?.();  // flush the field being edited
  $("enterState") && ($("enterState").textContent = "");
  try{ S = await post("/api/start", {scenario:D.scenario, assets:D.assets, preset:D.preset, reveal:REVEAL, ui:UI}); }
  catch(e){ if($("enterState")) $("enterState").textContent = t("cantStart") + e; else alert(t("cantStart") + e); return; }
  turn = 0; state = "idle"; show("stage");
  $("log").innerHTML = ""; $("caption").textContent = ""; $("typed").value = "";
  $("doneBtn").textContent = t("done"); $("doneBtn").onclick = () => finish();
  S.goals = []; S.lastBetter = ""; S.found = 0; showFound();
  $("stage").classList.toggle("coached", COACH); renderGoals(); coachText();
  $("title").textContent = S.scenario.title;
  $("setting").textContent = t("goalLabel") + S.scenario.user_goal;
  $("turnText").textContent = `0 / ${S.scenario.max_turns}`;
  if(S.assets?.background){ $("room").style.backgroundImage = `linear-gradient(#0f111577,#0f1115dd),url(${S.assets.background})`; }
  if(!cam.on){ $("eyeText").textContent = t("camOff"); }
  renderCast();
  const n = S.scenario.cast.length;
  $("cast").dataset.n = n; $("cast").style.setProperty("--cols", n === 4 ? 2 : n);
  await sleep(600);
  await play(S.lines);
  listen();
}

function over(reason){
  state = "over"; stopRec(); cam.rec = false;
  $("micStatus").textContent = t("sceneOver") + reason;
  $("doneBtn").textContent = t("seeDebrief"); $("doneBtn").disabled = false; $("doneBtn").onclick = showDebrief;
}

$("coachBtn").onclick = () => $("stage").classList.toggle("coached");
$("retryBtn").onclick = takeBack;
$("logBtn").onclick = () => { $("log").classList.toggle("hidden"); $("stage").classList.toggle("logopen"); };
$("endBtn").onclick = () => { stopVoice(); over(t("endedByYou")); showDebrief(); };

async function showDebrief(){
  if(state === "debrief") return;
  state = "debrief"; stopVoice();
  show("debrief");
  $("debrief").innerHTML = `<h1>${t("debrief")}</h1><p class="sub">${t("debriefing")}</p>`;
  let d;
  try{
    const r = await fetch("/api/end", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id:S.id})});
    if(!r.ok) throw new Error(await r.text());
    d = await r.json();
  }catch(e){ $("debrief").innerHTML += `<p>${t("failed")}${esc(e)}</p><button onclick="location.reload()">${t("home")}</button>`; return; }
  const db = d.debrief;
  $("debrief").innerHTML = `
    <h1>${esc(S.scenario.title)} · ${t("debrief")}</h1>${attemptsHTML(d)}<p class="sub">${esc(d.ended)}</p>
    <div class="verdict">${esc(db.verdict)}</div>
    <section><h2>${t("goalsH")}</h2>${db.criteria.map(c => `<div class="crit"><span class="${c.met?"ok":"no"}">${c.met?"O":"X"}</span>
      <div><b>${esc(c.criterion)}</b> <small style="color:var(--mute)">(${t("turn")} ${c.turn})</small><div>${esc(c.why)}</div></div></div>`).join("")}</section>
    <section><h2>${t("hidden")}</h2>${d.cast.map(c => `<div class="secret">
      <b>${esc(c.name)} · ${esc(c.role)} ${c.revealed ? `<span class="badge" style="color:var(--good)">${t("told")}</span>` : `<span class="badge" style="color:var(--bad)">${t("kept")}</span>`}</b>
      <div><small style="color:var(--mute)">${t("gShort")}</small> ${esc(c.goal)}</div>
      <div><small style="color:var(--mute)">${t("secret")}</small> ${esc(c.secret)}</div>
      <div><small style="color:var(--mute)">${t("reveal")}</small> ${esc(c.reveal_when)}</div>
      <div><small style="color:var(--mute)">${t("trust")}</small> ${c.start_mood.trust} → ${c.end_mood.trust} · <small style="color:var(--mute)">${t("patience")}</small> ${c.start_mood.patience} → ${c.end_mood.patience}</div></div>`).join("")}</section>
    <section><h2>${t("moments")}</h2>${db.turning_points.map(x => `<div class="tp">
      <small style="color:var(--mute)">${t("turn")} ${x.turn} · ${esc(x.character)}</small>
      <div>${t("me")}: “${esc(x.what_user_said)}”</div><div class="inner" style="color:#f0a493">${t("thought")}${esc(x.what_they_thought)}</div>
      <div class="try">${t("tryThis")}${esc(x.try_instead)}</div></div>`).join("")}</section>
    <section><h2>${t("full")}</h2><div class="tl">${d.lines.map(l => `<div class="l ${l.speaker==="user"?"user":""}">
      <span class="who">${t("turn")} ${l.turn} · ${esc(l.speaker==="user"?t("me"):l.speaker==="narration"?t("narr"):l.speaker)}</span>
      <div>${esc(l.say)}${l.cues ? `<div>${l.cues.split("; ").map(c => `<span class="cue">👁 ${esc(c)}</span>`).join("")}</div>` : ""}
      ${l.inner ? `<div class="inner">💭 ${esc(l.inner)} <small>(${t("trust")} ${l.mood?.trust} · ${t("patience")} ${l.mood?.patience})</small></div>` : ""}</div></div>`).join("")}</div></section>
    <div class="row"><button class="primary" id="againBtn">${t("again")}</button><button onclick="location.reload()">${t("other")}</button></div>`;
  $("againBtn").onclick = enter;
}

// ---------- home ----------
async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!r.ok){ let m = await r.text(); try{ m = JSON.parse(m).detail; }catch(e){} throw new Error(m); }
  return r.json();
}
function show(id){ ["home", "build", "brief", "stage", "debrief"].forEach(x => $(x).classList.toggle("hidden", x !== id)); window.scrollTo(0, 0); }
function setHomeBusy(on, msg){ document.querySelectorAll("#home button").forEach(b => b.disabled = on); $("makeState").textContent = msg || ""; }

micLabel(); applyLang();
document.querySelectorAll("#uiLang button").forEach(b => b.onclick = () => {
  UI = b.dataset.lang; try{ localStorage.setItem("standin-ui", UI); }catch(e){}
  applyLang(); micLabel(); loadPresets(); renderStarters(); micButton();
});
const loadPresets = () => fetch("/api/presets").then(r => r.json()).then(list => {
  $("presets").innerHTML = list.filter(p => p.ui === (UI === "ko" ? "ko" : "en")).map(p => `<button class="card" data-id="${esc(p.id)}"><b>${esc(p.title)}</b>
    <small>${esc(p.situation)}</small><small>👥 ${p.cast.map(esc).join(", ")}</small></button>`).join("");
  document.querySelectorAll("#presets .card").forEach(b => b.onclick = async () => {
    setHomeBusy(true, t("loading"));
    try{ openBrief(await (await fetch("/api/preset/" + b.dataset.id)).json()); }catch(e){ setHomeBusy(false, t("failed") + e); }
  });
});
loadPresets();
const renderStarters = () => {
  $("starters").innerHTML = ["s1", "s2", "s3"].map(k => `<button type="button">${esc(t(k))}</button>`).join("");
  $("starters").querySelectorAll("button").forEach(b => b.onclick = () => openBuild(b.textContent));
};
renderStarters();
$("buildBtn").onclick = () => openBuild($("situation").value.trim());
$("situation").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); openBuild($("situation").value.trim()); } });
$("bsend").onclick = () => buildSay($("bsay").value);
$("bsay").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); buildSay($("bsay").value); } });
$("baddBtn").onclick = () => { $("bsay").value = t("bAddText"); $("bsay").focus(); };
$("bplaceBtn").onclick = () => { $("bsay").value = t("bPlaceText"); $("bsay").focus(); };
$("benter").onclick = stepInside;
</script>
