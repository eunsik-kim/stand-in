app = "stand-in"
primary_region = "nrt"

[build]

[env]
  # The site is public with no login: model calls stop once the server has spent this many dollars since it started.
  STANDIN_SERVER_BUDGET = "15"

# Scenes live in memory, so one machine stays up and never sleeps mid-rehearsal.
[http_service]
  internal_port = 8010
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "standin_runs"
  destination = "/app/runs"
