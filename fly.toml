app = "stand-in"
primary_region = "nrt"

[build]

[env]
  # Model calls stop once the server has spent this many dollars in a UTC day (kept in the store, so restarts don't reset it).
  STANDIN_SERVER_BUDGET = "15"
  # The public site needs Google sign-in: without its keys the server refuses to start instead of opening up.
  STANDIN_REQUIRE_LOGIN = "1"

# Scenes live in memory, so one machine stays up and never sleeps mid-rehearsal.
[http_service]
  internal_port = 8010
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "standin_runs"
  destination = "/app/runs"
